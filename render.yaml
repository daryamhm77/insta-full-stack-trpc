# Render blueprint: NestJS API (Docker) + Postgres
# https://render.com/docs/blueprint-spec
#
# Values marked `sync: false` are NOT stored in git — Render prompts for them when
# the blueprint is applied, and they must be filled in before the first deploy works.
# WEB_URL / BETTER_AUTH_URL are the Vercel origin; put a placeholder in first, then
# update both after the frontend is live and redeploy this service.

databases:
  - name: insta-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: insta
    user: insta
    ipAllowList: [] # internal connections only

services:
  - type: web
    name: insta-api
    runtime: docker
    plan: free
    region: oregon # must match the database region
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: insta-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: STORAGE_TYPE
        value: cloudinary
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: veyzctql
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
